<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday ✨</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap">
<style>
/* ===== COULEURS & BASE ===== */
:root{--bg:#0b0607;--panel:#140a0c;--fg:#f3e9df;--muted:#b9a79a;--red:#c1272d;--line:rgba(193,39,45,.55);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(80px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 20% 0%,#2a0d12 0,transparent 55%),var(--bg);color:var(--fg);font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0e0709;z-index:11}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
/* ===== HEADER / MENU ===== */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(14,7,9,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{font:2rem "Great Vibes",cursive;color:var(--fg);text-decoration:none;border-bottom:2px solid var(--red);line-height:1.1}
nav{display:flex;gap:26px;align-items:center}
nav a{color:var(--fg);text-decoration:none;font-size:1rem;padding:6px 0}
nav a.on{color:var(--red);border-bottom:2px solid var(--red)}
.menu{display:none;background:none;border:0;color:var(--fg);font-size:1.6rem;cursor:pointer}
/* ===== 1. L-ACCUEIL (hero + gâteau) ===== */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 40%,rgba(224,90,40,.28),transparent 45%),radial-gradient(circle at 92% 18%,rgba(120,20,30,.5),transparent 35%)}
.hero .wrap{position:relative;min-height:470px}
.txt{position:relative;z-index:2;max-width:56%;padding:44px 0 40px}
.eyebrow{font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);line-height:1.7}
h1{font:400 clamp(2rem,6.4vw,3.5rem)/1.08 "Playfair Display",Georgia,serif;margin:.3em 0 .35em;text-shadow:0 2px 20px #000}
h1 .l2{display:block;color:var(--red)}
.sub{font-size:1.3rem;font-style:italic;margin:0 0 6px}
.cd{color:#ff5a64;font-style:italic;font-size:1.1rem;margin:0 0 20px}
.btn{display:inline-flex;gap:12px;align-items:center;background:linear-gradient(180deg,#b3232a,#7d151b);color:#fff;border:0;border-radius:999px;padding:14px 28px;font:500 1.05rem "Cormorant Garamond",serif;cursor:pointer;text-decoration:none;box-shadow:0 8px 24px rgba(193,39,45,.3)}
.cake{position:absolute;right:-6%;bottom:-6px;width:min(60%,540px);z-index:1;cursor:pointer}
.cake svg{display:block;width:100%;height:auto}
.glow,.flame{transition:opacity .9s}
.out .glow,.out .flame{opacity:0}
.note{position:absolute;right:2%;bottom:14%;z-index:2;transform:rotate(-7deg);background:#d8c2a4;color:#4b3626;font:italic 1.05rem "Cormorant Garamond",serif;padding:16px 14px;width:104px;text-align:center;box-shadow:0 8px 20px #000;line-height:1.3}
/* ===== 2. BOUGIES ===== */
.candle{text-align:center;padding:30px 0 10px}
.candle .q{font-size:1.3rem;font-style:italic;margin:0 0 16px}
#sur{max-height:0;opacity:0;overflow:hidden;transition:max-height 1.6s ease,opacity 1.6s ease}
#sur.on{max-height:300px;opacity:1;margin-top:22px}
#sur h3{font:400 1.7rem "Playfair Display",serif;color:#ff6670;margin:0 0 6px}
#sur p{margin:0;font-size:1.2rem}
/* ===== ICONES (les 4 mzyat) ===== */
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px;padding:30px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.f{text-align:center;padding:6px 8px}
.ic{width:60px;height:60px;border:1.5px solid var(--red);border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:rgba(193,39,45,.06)}
.ic svg{width:26px;height:26px;stroke:var(--fg);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.f b{display:block;font:500 1.05rem "Playfair Display",serif;line-height:1.25}
.f small{display:block;color:var(--muted);font-size:.88rem;margin-top:6px;line-height:1.3}
/* ===== 3. SWAR (carousel) ===== */
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;margin:38px 0 16px;gap:10px}
.sec-h h2{font:400 1.8rem "Playfair Display",serif;margin:0}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.sec-h a{color:var(--fg);text-decoration:none;font-size:.95rem;white-space:nowrap}
.car{display:flex;align-items:center;gap:10px}
.arr{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--muted);background:transparent;color:var(--fg);cursor:pointer;font-size:1rem}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;flex:1;padding:4px}
.track::-webkit-scrollbar{display:none}
.ph{flex:none;width:clamp(185px,58vw,250px);height:clamp(150px,46vw,200px);border-radius:10px;border:1px solid rgba(255,255,255,.14);scroll-snap-align:start;position:relative;overflow:hidden;cursor:zoom-in}
.ph.first{border:2px solid var(--red);box-shadow:0 0 16px rgba(193,39,45,.4)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:.88rem;font-style:italic;line-height:1.25;background:linear-gradient(transparent,rgba(0,0,0,.88))}
.dots{display:flex;gap:10px;justify-content:center;margin:14px 0 0}
.dots i{width:8px;height:8px;border-radius:50%;background:#4a3a3a}
.dots i.on{background:var(--red)}
/* ===== 4. TMENNA CHI 7AJA (fnanis) ===== */
.skywrap{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(#0a0615,#2a0d18 80%,#4a1218)}
#sky{display:block;width:100%;height:340px}
#wishcap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-style:italic;font-size:1.15rem;padding:0 16px;text-shadow:0 2px 10px #000;pointer-events:none}
.wform{display:flex;gap:10px;margin:14px 0 36px;flex-wrap:wrap}
.wform input{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:13px 20px;color:var(--fg);font:1.05rem "Cormorant Garamond",serif;outline:0}
/* ===== CITATION ===== */
.quote{margin:34px 0;padding:24px 28px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(110deg,rgba(142,27,34,.35),rgba(20,10,12,.6));display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.quote blockquote{margin:0;padding-left:22px;border-left:2px solid var(--red);font:italic 1.35rem/1.5 "Cormorant Garamond",serif;max-width:360px}
.quote span{color:var(--muted);letter-spacing:.14em;font-style:italic;font-size:.92rem}
/* ===== 5. MESSAGE SECRET ===== */
.gift{margin:0 0 30px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:var(--panel);display:flex;align-items:center;gap:26px;padding:20px 26px;flex-wrap:wrap}
.gift>svg{width:150px;height:110px;flex:none;cursor:pointer}
.gift h3{font:400 1.7rem "Playfair Display",serif;margin:0 0 4px}
.gift p{margin:0 0 14px}
.gm{flex-basis:100%;max-height:0;opacity:0;overflow:hidden;transition:max-height 2.8s ease,opacity 2.8s ease;font-size:1.3rem;line-height:1.6;border-top:1px solid var(--line);padding-top:0}
.gift.open .gm{max-height:420px;opacity:1;padding-top:16px}
/* ===== FOOTER / ZOOM DYAL TSWIRA / WOROUD ===== */
.wave{display:block;width:100%;height:70px;margin-top:10px}
footer{text-align:center;color:var(--muted);font-size:.95rem;padding:0 20px 36px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
.petal{position:fixed;top:-30px;z-index:20;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
/* ===== TELIFON (écran sghir) ===== */
@media(max-width:720px){
  nav a:not(.on){display:none}nav .menu{display:block}
  nav.open{position:absolute;top:70px;left:0;right:0;flex-direction:column;background:#0e0709;padding:12px 0 18px}nav.open a{display:block}
  .hero .wrap{min-height:0}
  .txt{max-width:100%;padding:30px 0 0}
  h1{font-size:clamp(1.9rem,8.4vw,2.6rem)}
  .cake{position:relative;right:auto;bottom:auto;width:104%;margin:6px -2% 0}
  .note{right:3%;bottom:8%;width:92px;font-size:.95rem;padding:12px 10px}
  .gift>svg{width:110px}
  .gift{padding:18px}
}
</style>
</head>

  $("prev").onclick = function(){ tr.scrollBy({left:-step(),behavior:"smooth"}); };
  $("next").onclick = function(){ tr.scrollBy({left:step(),behavior:"smooth"}); };
  tr.addEventListener("scroll", function(){
    var i = Math.round(tr.scrollLeft / step()), max = dots.length-1;
    if (tr.scrollLeft + tr.clientWidth >= tr.scrollWidth - 4) i = max;
    dots.forEach(function(d,k){ d.classList.toggle("on", k === Math.min(i,max)); });
  });
  var lb = $("lb"), lbi = lb.querySelector("img");
  document.querySelectorAll(".ph img").forEach(function(im){ im.onclick = function(){ lbi.src = im.src; lb.classList.add("on"); }; });
  lb.onclick = function(){ lb.classList.remove("on"); };

  /* ---------- 4) Fnanis dyal « Tmenna chi 7aja » ---------- */
  var sc = $("sky"), sx = sc.getContext("2d"), SW = 0, SH = 340, bgs = [], lan = [], stars = [], cap = $("wishcap");
  function ss(){
    var r = sc.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    SW = r.width; sc.width = SW*d; sc.height = SH*d; sx.setTransform(d,0,0,d,0,0);
    bgs = []; for (var i=0;i<90;i++) bgs.push({x:R()*SW,y:R()*SH,r:R()*1.2+.3,p:R()*6});
  }
  function addL(t){ var x = Math.max(70, Math.min(SW-70, SW*(.12+R()*.76))); lan.push({x0:x,y:SH+30,t:0,ph:R()*6,ty:40+R()*SH*.35,txt:t}); }
  function skyFrame(t){
    sx.clearRect(0,0,SW,SH);
    bgs.forEach(function(b){ sx.globalAlpha = .3+.7*Math.abs(Math.sin(t/1000+b.p)); sx.fillStyle = "#fff"; sx.fillRect(b.x,b.y,b.r,b.r); });
    sx.globalAlpha = 1;
    stars.forEach(function(s){
      var a = .65+.35*Math.sin(t/600+s.p), g = sx.createRadialGradient(s.x,s.y,0,s.x,s.y,16);
      g.addColorStop(0,"rgba(255,214,120,"+a+")"); g.addColorStop(1,"rgba(255,160,60,0)");
      sx.fillStyle = g; sx.fillRect(s.x-16,s.y-16,32,32);
    });
    for (var i=lan.length-1;i>=0;i--){
      var l = lan[i]; l.t++; l.y -= .8;
      var x = l.x0 + Math.sin(l.t/45+l.ph)*14;
      if (l.y <= l.ty){ stars.push({x:x,y:l.y,txt:l.txt,p:R()*6}); if (stars.length>40) stars.shift(); lan.splice(i,1); continue; }
      var k = Math.max(.35, Math.min(1, (l.y-l.ty)/140+.35));
      sx.save(); sx.translate(x,l.y); sx.scale(k,k);
      var g = sx.createRadialGradient(0,0,0,0,0,46); g.addColorStop(0,"rgba(255,170,70,.55)"); g.addColorStop(1,"rgba(255,120,30,0)");
      sx.fillStyle = g; sx.fillRect(-46,-46,92,92);
      var b = sx.createLinearGradient(0,-17,0,17); b.addColorStop(0,"#ffe09a"); b.addColorStop(1,"#e8631f");
      sx.fillStyle = b; sx.beginPath(); sx.moveTo(-9,-17); sx.lineTo(9,-17); sx.lineTo(13,17); sx.lineTo(-13,17); sx.closePath(); sx.fill();
      sx.restore();
      sx.globalAlpha = k; sx.fillStyle = "#f3e9df"; sx.font = "italic 13px Georgia,serif"; sx.textAlign = "center";
      sx.fillText(l.txt, x, l.y+34*k+8); sx.globalAlpha = 1;
    }
    requestAnimationFrame(skyFrame);
  }
  function send(){ var i = $("wi"), v = i.value.trim(); if (!v) return; addL(v); i.value = ""; cap.textContent = ""; }
  $("wsend").onclick = send;
  $("wi").addEventListener("keydown", function(e){ if (e.key === "Enter") send(); });
  sc.addEventListener("pointerdown", function(e){
    var r = sc.getBoundingClientRect(), x = e.clientX-r.left, y = e.clientY-r.top, hit = null;
    stars.forEach(function(s){ if (Math.hypot(s.x-x,s.y-y) < 24) hit = s; });
    cap.textContent = hit ? "« " + hit.txt + " »" : "";
  });
  addEventListener("resize", ss);
  ss(); requestAnimationFrame(skyFrame);
  setTimeout(function(){ TEXTS.seeds.forEach(function(t,i){ setTimeout(function(){ addL(t); }, i*900); }); }, 600);

  /* ---------- 5) Message secret: kayt-7el b chwiya ---------- */
  var gift = document.querySelector(".gift");
  function openG(){ if (gift.classList.contains("open")) return; gift.classList.add("open"); rain(); }
  $("open").onclick = openG; $("gbox").onclick = openG;
})();
</script>
